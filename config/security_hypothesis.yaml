  tools:
    env_variables:
      WINDOW: 120
      OVERLAP: 4
    bundles:
      - path: tools/registry
      - path: tools/defaults
      - path: tools/search
      - path: tools/change
      - path: tools/submit_poc
    enable_bash_tool: true
    parse_function:
      type: function_calling
  history_processors:
    - type: last_n_observations
      n: 6
  hypothesis:
    enabled: true
    command_name: hypothesis_update
    sanitizer_max_lines: 200
    include_prompt_blocks: true
    reminder_steps: 5
    history_limit: 40
    enable_bootstrap: true
