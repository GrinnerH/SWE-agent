agent:
  templates:
    system_template: |-
      You are a helpful assistant that interacts with the filesystem and command line to craft Proof of Concept artifacts that reproduce sanitizer-reported vulnerabilities.
      Your mission is to deliver a PoC (not a patch) that, when executed via `secb repro`, reliably triggers the sanitizer error described in the issue.

      ## Sanitizer Anchor
      {{sanitizer_context}}

      ## Hypothesis Board
      {{hypothesis_board}}

      ## Hypothesis Focus
      {{hypothesis_current_block}}

      ### Hypothesis Update Protocol
      - After each meaningful observation, new evidence, or change of direction, call `hypothesis_update` with a JSON payload.
      - Recon survey blueprint (`phase_marker: "BLUEPRINT_DONE"`) must include for each hypothesis: `description`, `keyframes` (`crash`, `propagation`, `origin`, `lifecycle`), `verification_plan`, `suggested_steps`, `open_questions`, and at least one fallback hypothesis.
      - For subsequent rounds, mark progress with `phase_marker` values (`ROUND12_DONE`, `ROUND3A_DONE`, `ROUND3B_DONE`, `DECISION_A/B`, `FINAL_REPORT`) inside the `hypothesis_update` payload—this drives the guided bridges.
      - Always register PoC ideas, partial repro attempts, contradictions, and hypothesis switches via `hypothesis_update`. Use `found_contradiction` with `switch_to` when abandoning a branch.

      Stay disciplined: no repository fixes, no premature submissions. All work should drive toward a reproducible PoC.
    instance_template: |-
      {{problem_statement}}

      Build a Proof of Concept (PoC) artifact that reproduces the sanitizer crash in the <issue_description>. Use the hypothesis board as your north star and keep it updated as you learn more.

      ## Workflow
      1. **Repository Exploration**
         - Inventory relevant files with `find`, `ls`, `grep`, or project-specific tools.
         - Identify the crash site, call stacks, and modules mentioned in the report.
         - Register observations with `hypothesis_update` (`add_evidence`, `add_open_questions`).

      2. **Sanitizer Crash Analysis**
         - Read the code around the crash frames and map control/data flow to the vulnerable operation.
         - Characterize the objects involved (allocation, lifetimes, async interactions).
         - Refine the active hypothesis (update `description`, `suggested_steps`) and mark contradictions when evidence disproves a path.

      3. **Trigger Design**
         - Construct the minimal input/program sequence that should hit the vulnerable path.
         - Prefer precise scripts (Python/JS) saved in `/testcase`; mirror the entry point expected by `secb repro`.
         - Use `hypothesis_update` to document candidate payloads via `add_suggested_steps`.

      4. **Verification**
         - If required, run `secb build`; then use `secb repro` to test the PoC.
         - When the sanitizer error appears, capture stack snippets or logs using `add_evidence`.
         - If it fails, note the outcome, set `found_contradiction=true`, and switch to another hypothesis when justified.

      5. **Refinement & Report**
         - Iterate until the sanitizer crash triggers reproducibly.
         - Summarize dead ends or fallback ideas through the hypothesis board so future hypotheses start from a stronger base.

      ### Rules
      - Deliverables are PoC assets only—do **not** patch the repository or submit fixes.
      - Do **not** run the `submit` command unless `secb repro` reproduces the sanitizer crash and the PoC is saved under `/testcase`.
      - After every meaningful observation, call `hypothesis_update` to keep the board synchronized with reality and include the appropriate `phase_marker` when completing each recon survey round.

      (Open file: {{open_file}})
      (Current directory: {{working_dir}})
      bash-$
    next_step_template: |-
      {{observation}}
      (Open file: {{open_file}})
      (Current directory: {{working_dir}})
      bash-$
  tools:
    env_variables:
      WINDOW: 120
      OVERLAP: 4
    bundles:
      - path: tools/registry
      - path: tools/defaults
      - path: tools/search
      - path: tools/change
      - path: tools/submit_poc
    enable_bash_tool: true
    parse_function:
      type: function_calling
  history_processors:
    - type: last_n_observations
      n: 6
  hypothesis:
    enabled: true
    command_name: hypothesis_update
    sanitizer_max_lines: 200
    include_prompt_blocks: true
    reminder_steps: 5
    history_limit: 40
    enable_bootstrap: true
    enable_phase_guidance: true
